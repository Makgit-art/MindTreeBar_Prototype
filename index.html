<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebAR Image Tracking</title>
    
    <!-- 1. Load A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <!-- 2. Load MindAR for Image Tracking in A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <!-- 3. Load A-Frame Extras (Required to load .fbx files) -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
    
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!-- The AR Scene: Automatically asks for camera permissions -->
    <!-- Note: Replace 'targets.mind' with your compiled image target file from the MindAR compiler -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <!-- Pre-load your assets here -->
      <a-assets>
        <!-- Replace 'model.fbx' with the actual path to your FBX file -->
        <a-asset-item id="myFbxModel" src="model.fbx"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- The AR Anchor: targetIndex 0 is the first image ("Reticle for Mind TreeV3.png") -->
      <a-entity mindar-image-target="targetIndex: 0">
        
        <!-- The Model: Spawns and tracks to the image -->
        <!-- Adjust scale="0.1 0.1 0.1" and position as needed for your specific model size -->
        <a-entity 
          fbx-model="src: #myFbxModel" 
          position="0 0 0" 
          scale="0.1 0.1 0.1" 
          rotation="0 0 0">
        </a-entity>
        
      </a-entity>
    </a-scene>
  </body>
</html>
